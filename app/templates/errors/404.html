{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1 fw-bold text-primary mb-3" style="letter-spacing: 2px;">404</h1>
            <h2 class="mb-3">Page Not Found</h2>
            <p class="lead mb-4">The page you are looking for does not exist or has been moved.</p>
            <hr class="my-4">
            <p class="mb-4">Please check the URL or use the navigation menu to find what you need.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-lg btn-primary">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
