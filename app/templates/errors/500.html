{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-1 fw-bold text-danger mb-3" style="letter-spacing: 2px;">500</h1>
            <h2 class="mb-3">Internal Server Error</h2>
            <p class="lead mb-4">An unexpected error has occurred. The administrator has been notified.</p>
            <hr class="my-4">
            <p class="mb-4">Please try again later or contact support if the problem persists.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-lg btn-primary">Return to Home</a>
        </div>
    </div>
</div>
{% endblock %}
